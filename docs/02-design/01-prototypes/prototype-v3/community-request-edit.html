<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Story Hub — ขอแก้ไขคอนเทนต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-paper:#F3EEE4; --color-sand:#E7DFCF; --color-stone:#C9BFAC; --color-bark:#8A7F6C;
  --color-ink:#2E2A22; --color-clay:#B0673F; --color-moss:#6B7355; --color-ochre:#C99A44;
  --color-indigo:#4C5B62;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px; --space-2xl:48px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:16px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:'Sarabun',sans-serif;font-size:18px;line-height:1.7;}
header.site{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-xl);border-bottom:1px solid var(--color-stone);}
.wordmark{font-weight:700;font-size:22px;color:var(--color-ink);text-decoration:none;}
nav.site a{margin-left:var(--space-lg);text-decoration:none;color:var(--color-ink);font-size:16px;}
main{max-width:720px;margin:0 auto;padding:var(--space-xl) var(--space-xl) var(--space-2xl);}
h1{font-size:32px;font-weight:600;margin:0 0 var(--space-md);}
p.hint{font-size:16px;color:var(--color-bark);margin:0 0 var(--space-lg);}
.step{background:#fff;border:1px solid var(--color-stone);border-radius:var(--radius-md);padding:var(--space-lg);margin-bottom:var(--space-lg);}
label{display:block;font-size:16px;font-weight:600;margin-bottom:var(--space-xs);margin-top:var(--space-md);}
label:first-child{margin-top:0;}
input[type=text], textarea{width:100%;border:1px solid var(--color-stone);border-radius:var(--radius-sm);padding:var(--space-md);font-family:inherit;font-size:18px;color:var(--color-ink);background:#fff;}
textarea{min-height:100px;}
.current-value{background:var(--color-sand);border-radius:var(--radius-sm);padding:var(--space-md);font-size:16px;color:var(--color-bark);margin-bottom:var(--space-sm);}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 var(--space-lg);border-radius:var(--radius-md);font-size:16px;font-weight:600;cursor:pointer;border:1px solid transparent;}
.btn-primary{background:var(--color-clay);color:var(--color-paper);}
.field-error{color:#A13D2C;font-size:14px;margin-top:var(--space-xs);display:none;}
.success-note{background:#E4F1E6;color:var(--color-moss);border-radius:var(--radius-sm);padding:var(--space-md);margin-top:var(--space-md);display:none;}
.deny-note{background:#F7E0DA;color:#A13D2C;border-radius:var(--radius-sm);padding:var(--space-lg);font-size:16px;}
.publish-bar{display:flex;justify-content:flex-end;margin-top:var(--space-xl);}
[hidden]{display:none !important;}
</style>
</head>
<body>

<header class="site">
  <a class="wordmark" href="community-register.html">Local Story Hub</a>
  <nav class="site"><a href="community-dashboard.html">← กลับไปหน้าจัดการข้อมูล</a></nav>
</header>

<main>
  <div id="deny-view" hidden>
    <h1>ขอแก้ไขคอนเทนต์</h1>
    <div class="deny-note" id="deny-text"></div>
  </div>

  <div id="page-view" hidden>
    <h1>ขอแก้ไขคอนเทนต์: <span id="content-title-label"></span></h1>
    <p class="hint">คำขอนี้จะต้องผ่านการอนุมัติจากอาจารย์ที่ปรึกษา/แอดมินก่อน คอนเทนต์ที่เผยแพร่อยู่จะยังไม่เปลี่ยนแปลงจนกว่าจะได้รับอนุมัติ (BL-023)</p>

    <div class="step">
      <label>ชื่อคอนเทนต์ปัจจุบัน</label>
      <div class="current-value" id="current-title"></div>
      <label for="new-title">ชื่อคอนเทนต์ที่ขอแก้ไข</label>
      <input type="text" id="new-title">

      <label style="margin-top:var(--space-lg)">เนื้อหา/แคปชันปัจจุบัน</label>
      <div class="current-value" id="current-body"></div>
      <label for="new-body">เนื้อหา/แคปชันที่ขอแก้ไข</label>
      <textarea id="new-body"></textarea>
      <div class="field-error" id="err-nochange">กรุณาแก้ไขอย่างน้อย 1 ช่องก่อนส่งคำขอ</div>
    </div>

    <div class="publish-bar">
      <button class="btn btn-primary" onclick="submitEditRequest()">ส่งคำขอแก้ไข</button>
    </div>
    <div class="success-note" id="submit-success"></div>
  </div>
</main>

<script>
var CONTENT_KEY = 'lsh_v3_content';
var EDIT_REQ_KEY = 'lsh_v3_edit_requests';
var SESSION_KEY = 'lsh_v3_session';

function readList(key){ try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; } }
function writeList(key, list){ localStorage.setItem(key, JSON.stringify(list)); }
function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function genId(prefix){ return prefix + Math.floor(1000 + (Date.now() % 9000)); }

function getParam(name){
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

var session = readSession();
if(!session){
  window.location.href = 'community-register.html';
}

var contentId = getParam('contentId');
var content = readList(CONTENT_KEY).filter(function(c){ return c.id === contentId; })[0];

function showDeny(text){
  document.getElementById('deny-view').hidden = false;
  document.getElementById('deny-text').textContent = text;
}

if(session){
  if(!content){
    showDeny('ไม่พบคอนเทนต์นี้');
  }else if(content.communityId !== session.id){
    showDeny('ขอแก้ไขได้เฉพาะคอนเทนต์ของชุมชนตนเองเท่านั้น (ตัดสินใจแล้ว 2026-09-22 — ไม่รองรับการขอแก้ไขข้ามชุมชน)');
  }else if(content.status !== 'เผยแพร่แล้ว'){
    showDeny('ขอแก้ไขได้เฉพาะคอนเทนต์ที่เผยแพร่ (published) แล้วเท่านั้น');
  }else{
    document.getElementById('page-view').hidden = false;
    document.getElementById('content-title-label').textContent = content.title;
    document.getElementById('current-title').textContent = content.title;
    document.getElementById('current-body').textContent = content.bodyTh;
    document.getElementById('new-title').value = content.title;
    document.getElementById('new-body').value = content.bodyTh;
  }
}

function submitEditRequest(){
  var newTitle = document.getElementById('new-title').value.trim();
  var newBody = document.getElementById('new-body').value.trim();
  var changed = (newTitle !== content.title) || (newBody !== content.bodyTh);
  var errEl = document.getElementById('err-nochange');
  if(!changed){
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  var requests = readList(EDIT_REQ_KEY);
  var today = new Date();
  var dateStr = today.getDate() + '/' + (today.getMonth()+1) + '/' + (today.getFullYear()+543);
  requests.unshift({
    id: genId('er'),
    contentId: content.id,
    contentTitle: content.title,
    communityId: session.id,
    communityName: session.name,
    proposedChanges: {title: newTitle, bodyTh: newBody},
    originalValues: {title: content.title, bodyTh: content.bodyTh},
    status: 'รอพิจารณา',
    rejectionReason: null,
    createdAt: dateStr
  });
  writeList(EDIT_REQ_KEY, requests);

  var successEl = document.getElementById('submit-success');
  successEl.style.display = 'block';
  successEl.textContent = 'ส่งคำขอแก้ไขแล้ว — สถานะ "รอพิจารณา" คอนเทนต์ที่เผยแพร่อยู่ยังไม่เปลี่ยนแปลงจนกว่าอาจารย์/แอดมินจะอนุมัติ';
  setTimeout(function(){ window.location.href = 'community-dashboard.html'; }, 1500);
}
</script>

</body>
</html>
