<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Story Hub — หน้าแรก (นักท่องเที่ยว)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-paper:#F3EEE4; --color-sand:#E7DFCF; --color-stone:#C9BFAC; --color-bark:#8A7F6C;
  --color-ink:#2E2A22; --color-clay:#B0673F; --color-moss:#6B7355; --color-ochre:#C99A44;
  --color-indigo:#4C5B62; --color-error:#A13D2C;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px;
  --space-2xl:48px; --space-3xl:64px; --space-4xl:96px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:16px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:'Sarabun',sans-serif;font-size:18px;line-height:1.7;}
a{color:var(--color-indigo);}
header.site{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-xl);border-bottom:1px solid var(--color-stone);background:var(--color-paper);}
.wordmark{font-weight:700;font-size:22px;letter-spacing:0.02em;color:var(--color-ink);text-decoration:none;}
nav.site a{margin-left:var(--space-lg);text-decoration:none;color:var(--color-ink);font-size:16px;}
nav.site a.active{color:var(--color-clay);font-weight:600;}
main{max-width:960px;margin:0 auto;padding:var(--space-3xl) var(--space-xl) var(--space-4xl);}
.hero h1{font-size:40px;font-weight:600;line-height:1.25;margin:0 0 var(--space-md);text-wrap:balance;}
.hero p{font-size:18px;color:var(--color-bark);max-width:60ch;margin:0 0 var(--space-xl);}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 var(--space-lg);border-radius:var(--radius-md);font-size:16px;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none;}
.btn-primary{background:var(--color-clay);color:var(--color-paper);}
.btn-secondary{background:transparent;color:var(--color-ink);border-color:var(--color-stone);}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-lg);margin-top:var(--space-2xl);}
.card{background:var(--color-sand);border:1px solid var(--color-stone);border-radius:var(--radius-md);padding:var(--space-lg);text-decoration:none;color:inherit;display:block;}
.card h3{font-size:22px;margin:0 0 var(--space-sm);}
.card p{font-size:16px;color:var(--color-bark);margin:0;}
.consent-badge{font-size:13px;color:var(--color-bark);border:1px solid var(--color-stone);border-radius:999px;padding:3px 12px;margin-left:var(--space-lg);}
.consent-badge.answered{color:var(--color-moss);border-color:var(--color-moss);}
.empty-state{color:var(--color-bark);}
</style>
</head>
<body>

<header class="site">
  <a class="wordmark" href="tourist-home-consent.html">Local Story Hub</a>
  <nav class="site">
    <a class="active" href="tourist-search-results.html">ค้นหาชุมชน</a>
    <a href="tourist-login.html" id="tourist-login-link">เข้าสู่ระบบ</a>
    <span id="tourist-session-info" class="consent-badge" style="display:none;"></span>
    <span id="consent-badge" class="consent-badge">ยังไม่ตอบ Consent</span>
  </nav>
</header>

<main>
  <section class="hero">
    <h1>ฟังเรื่องราวจากชุมชนจริง ก่อนออกเดินทาง</h1>
    <p>ค้นหาแหล่งท่องเที่ยวชุมชนที่น่าเชื่อถือ อ่านเรื่องราวที่เล่าโดยคนในพื้นที่จริง ไม่ใช่รีวิวจากคนแปลกหน้า</p>
    <a class="btn btn-primary" href="tourist-search-results.html">เริ่มค้นหาชุมชน</a>
  </section>

  <section class="cards" id="preview-cards">
    <p class="empty-state">กำลังโหลดเรื่องราวล่าสุด...</p>
  </section>
</main>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.LSH_FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

// เซสชันนักท่องเที่ยว — real Firebase Auth
onAuthStateChanged(auth, async function(user){
  var link = document.getElementById('tourist-login-link');
  var info = document.getElementById('tourist-session-info');
  if(!user){
    link.textContent = 'เข้าสู่ระบบ';
    link.href = 'tourist-login.html';
    link.onclick = null;
    info.style.display = 'none';
    return;
  }
  let displayName = user.email;
  try{
    var snap = await getDoc(doc(db, 'touristAccounts', user.uid));
    if(snap.exists()) displayName = snap.data().displayName;
  }catch(e){
    console.error('โหลดข้อมูล touristAccounts ไม่สำเร็จ', e);
  }
  link.textContent = 'ออกจากระบบ';
  link.href = '#';
  link.onclick = function(e){ e.preventDefault(); signOut(auth).then(function(){ window.location.reload(); }); };
  info.textContent = displayName;
  info.style.display = 'inline-block';
});

// การ์ดตัวอย่างหน้าแรก — ดึงเรื่องราวที่เผยแพร่แล้วจริงจากทั้งงานนิสิต (LSHRequests) และคอนเทนต์ชุมชน
// (CommunityContent) มารวมกัน 3 รายการล่าสุด — ดูรายละเอียดวิธีรวม schema ที่ tourist-search-results.html
async function loadPreview(){
  const container = document.getElementById('preview-cards');
  let items = [];
  try{
    const [studentSnap, communitySnap] = await Promise.all([
      getDocs(query(collection(db, 'LSHRequests'), where('status', '==', 'อนุมัติ'))),
      getDocs(query(collection(db, 'CommunityContent'), where('status', '==', 'เผยแพร่แล้ว'))),
    ]);
    studentSnap.forEach(function(d){
      const data = d.data();
      items.push({ id: d.id, type: 'student', title: data.title, communityName: data.community || 'ไม่ระบุชุมชน' });
    });
    communitySnap.forEach(function(d){
      const data = d.data();
      items.push({ id: d.id, type: 'community', title: data.title, communityName: data.communityName });
    });
  }catch(e){
    console.error('โหลดตัวอย่างเรื่องราวไม่สำเร็จ', e);
    container.innerHTML = '<p class="empty-state">โหลดเรื่องราวไม่สำเร็จ ลองรีเฟรชหน้าใหม่</p>';
    return;
  }
  items = items.slice(0, 3);
  if(items.length === 0){
    container.innerHTML = '<p class="empty-state">ยังไม่มีเรื่องราวที่เผยแพร่แล้วในระบบตอนนี้</p>';
    return;
  }
  container.innerHTML = items.map(function(it){
    return '<a class="card" href="tourist-story-detail.html?type=' + it.type + '&id=' + encodeURIComponent(it.id) + '">' +
      '<h3>' + escapeHtml(it.title) + '</h3>' +
      '<p>' + escapeHtml(it.communityName) + '</p>' +
    '</a>';
  }).join('');
}
loadPreview();

function readConsent(){
  try{ return JSON.parse(localStorage.getItem('lsh_consent')); }catch(e){ return null; }
}
function renderConsentBadge(){
  var c = readConsent();
  var badge = document.getElementById('consent-badge');
  if(!c){ badge.textContent = 'ยังไม่ตอบ Consent'; badge.classList.remove('answered'); return; }
  badge.textContent = c.analytics_consent ? 'ยินยอมทั้งหมด ✓' : 'ปฏิเสธข้อมูลที่ไม่จำเป็น';
  badge.classList.add('answered');
}
renderConsentBadge();
// consent-banner.js เขียน localStorage เองแล้วเรียก persistConsent() ไป Firestore (collection
// ConsentRecords) — หน้านี้แค่ subscribe การเปลี่ยนแปลงผ่าน storage event เพื่ออัปเดต badge
window.addEventListener('storage', renderConsentBadge);
</script>
<script type="module" src="consent-banner.js"></script>
<script>
// consent-banner.js ไม่ยิง 'storage' event ในแท็บเดียวกันที่เขียนเอง (spec ของ localStorage) —
// poll สั้นๆ เพื่ออัปเดต badge ทันทีหลังผู้ใช้ตอบ banner โดยไม่ต้องรีเฟรชหน้า
var pollConsent = setInterval(function(){
  if(window.LSHConsent && window.LSHConsent.hasAnswered()){
    var badge = document.getElementById('consent-badge');
    var c = window.LSHConsent.getConsent();
    badge.textContent = c.analytics_consent ? 'ยินยอมทั้งหมด ✓' : 'ปฏิเสธข้อมูลที่ไม่จำเป็น';
    badge.classList.add('answered');
    clearInterval(pollConsent);
  }
}, 400);
</script>

</body>
</html>
