<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Story Hub — ค้นหาแหล่งท่องเที่ยวชุมชน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --color-paper:#F3EEE4; --color-sand:#E7DFCF; --color-stone:#C9BFAC; --color-bark:#8A7F6C;
  --color-ink:#2E2A22; --color-clay:#B0673F; --color-moss:#6B7355; --color-ochre:#C99A44;
  --color-indigo:#4C5B62;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px; --space-xl:32px; --space-2xl:48px;
  --radius-sm:4px; --radius-md:8px; --radius-lg:16px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:'Sarabun',sans-serif;font-size:18px;line-height:1.7;}
header.site{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-xl);border-bottom:1px solid var(--color-stone);}
.wordmark{font-weight:700;font-size:22px;color:var(--color-ink);text-decoration:none;}
nav.site a{margin-left:var(--space-lg);text-decoration:none;color:var(--color-ink);font-size:16px;}
nav.site a.active{color:var(--color-clay);font-weight:600;}
main{max-width:1120px;margin:0 auto;padding:var(--space-xl);}
h1{font-size:32px;font-weight:600;margin:0 0 var(--space-md);}
.search-bar{display:flex;gap:var(--space-sm);margin-bottom:var(--space-xl);flex-wrap:wrap;}
.search-bar input{flex:1;min-width:220px;height:48px;padding:0 var(--space-md);border:1px solid var(--color-stone);border-radius:var(--radius-sm);font-size:18px;font-family:inherit;background:#fff;color:var(--color-ink);}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 var(--space-lg);border-radius:var(--radius-md);font-size:16px;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none;}
.btn-primary{background:var(--color-clay);color:var(--color-paper);}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-lg);}
.card{background:var(--color-sand);border:1px solid var(--color-stone);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;}
.card .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,var(--color-stone),var(--color-sand));display:flex;align-items:center;justify-content:center;color:var(--color-bark);font-size:14px;}
.card .body{padding:var(--space-md);display:flex;flex-direction:column;gap:var(--space-xs);flex:1;}
.card .card-actions{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;}
.card h3{font-size:22px;margin:0;}
.card p{font-size:16px;color:var(--color-bark);margin:0;}
.card .tag{display:inline-block;font-size:12px;color:var(--color-bark);border:1px solid var(--color-stone);border-radius:999px;padding:1px 8px;width:fit-content;}
.card a.btn-text{color:var(--color-indigo);font-weight:600;font-size:16px;text-decoration:none;}
.card a.maps-link{color:var(--color-bark);font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.card a.maps-link:hover{text-decoration:underline;}
.card .snippet-lang-toggle{display:flex;gap:4px;margin-top:2px;}
.card .mini-tab{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--color-stone);background:transparent;color:var(--color-bark);cursor:pointer;font-family:inherit;}
.card .mini-tab.active{background:var(--color-clay);color:var(--color-paper);border-color:var(--color-clay);}
.card .snippet-note{font-size:12px;color:var(--color-bark);margin:0;}
.card .snippet-note.error{color:#A13D2C;}
.result-note{font-size:14px;color:var(--color-bark);margin-bottom:var(--space-lg);}
.consent-badge{font-size:13px;color:var(--color-bark);border:1px solid var(--color-stone);border-radius:999px;padding:3px 12px;margin-left:var(--space-lg);}
.consent-badge.answered{color:var(--color-moss);border-color:var(--color-moss);}
.empty-state{padding:var(--space-2xl);text-align:center;color:var(--color-bark);border:1px dashed var(--color-stone);border-radius:var(--radius-md);}
</style>
</head>
<body>

<header class="site">
  <a class="wordmark" href="tourist-home-consent.html">Local Story Hub</a>
  <nav class="site">
    <a class="active" href="tourist-search-results.html">ค้นหาชุมชน</a>
    <a href="tourist-login.html" id="tourist-login-link">เข้าสู่ระบบ</a>
    <span id="tourist-session-info" class="consent-badge" style="display:none;"></span>
    <span id="consent-badge" class="consent-badge">ยังไม่ตอบ Consent</span>
  </nav>
</header>

<main>
  <h1>ค้นหาแหล่งท่องเที่ยวชุมชน</h1>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="ค้นหาชื่อชุมชน หรือชื่อเรื่องราว" aria-label="ค้นหาแหล่งท่องเที่ยวชุมชน" oninput="filterResults()">
    <button class="btn btn-primary" onclick="filterResults()">ค้นหา</button>
  </div>
  <p class="result-note">ผลลัพธ์จากเนื้อหาที่เผยแพร่แล้วจริงในระบบเท่านั้น (ผลงานนิสิตที่อาจารย์อนุมัติแล้ว + คอนเทนต์ที่ชุมชนเผยแพร่เอง) — ไม่ใช่รีวิวจากบุคคลภายนอก</p>

  <div class="results" id="results"><p class="empty-state">กำลังโหลด...</p></div>
</main>

<script src="firebase-config.js"></script>
<script src="ai-assist-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(window.LSH_FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const selfUrl = 'tourist-search-results.html';
let currentTourist = null; // { uid, displayName } or null — ใช้เกต AI แปลภาษาของแต่ละการ์ด (BL-009)

function hasAiProxy(){
  return typeof window.LSH_AI_PROXY_URL !== 'undefined'
    && window.LSH_AI_PROXY_URL
    && window.LSH_AI_PROXY_URL.indexOf('YOUR_SUBDOMAIN') === -1;
}

// เรียก AI ผ่าน Cloudflare Worker proxy — pattern เดียวกับ tourist-story-detail.html/
// community-create-content.html (บังคับ login ก่อนใช้เสมอ กันเรียกใช้ AI quota ฟรีจากภายนอก)
async function callAiProxy(action, payload){
  if(!hasAiProxy()) throw new Error('AI backend ยังไม่พร้อมใช้งาน (ยังไม่ได้ deploy Cloudflare Worker หรือยังไม่ตั้งค่า URL ใน ai-assist-config.js)');
  if(!currentTourist) throw new Error('ต้องเข้าสู่ระบบก่อนใช้งานฟีเจอร์ AI นี้');
  var idToken = await auth.currentUser.getIdToken();
  var controller = new AbortController();
  var timedOut = false;
  var timeoutId = setTimeout(function(){ timedOut = true; controller.abort(); }, 20000);
  try{
    var res = await fetch(window.LSH_AI_PROXY_URL + '/ai/' + action, {
      method: 'POST', signal: controller.signal,
      headers: { 'Authorization': 'Bearer ' + idToken, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    var data = await res.json();
    if(!data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data.result;
  }catch(e){
    if(timedOut) throw new Error('หมดเวลารอคำตอบจาก AI (เกิน 20 วินาที) ลองใหม่อีกครั้ง');
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function readConsent(){
  try{ return JSON.parse(localStorage.getItem('lsh_consent')); }catch(e){ return null; }
}
(function renderConsentBadge(){
  var c = readConsent();
  var badge = document.getElementById('consent-badge');
  if(!c) return;
  badge.textContent = c.analytics_consent ? 'ยินยอมทั้งหมด ✓' : 'ปฏิเสธข้อมูลที่ไม่จำเป็น';
  badge.classList.add('answered');
})();

// เซสชันนักท่องเที่ยว — real Firebase Auth
onAuthStateChanged(auth, async function(user){
  var link = document.getElementById('tourist-login-link');
  var info = document.getElementById('tourist-session-info');
  if(!user){
    currentTourist = null;
    link.textContent = 'เข้าสู่ระบบ';
    link.href = 'tourist-login.html';
    link.onclick = null;
    info.style.display = 'none';
    if(displayedItems.length) renderResults(displayedItems); // เลี่ยง flash "ไม่มีผลลัพธ์" ถ้า loadResults() ยังไม่เสร็จ
    return;
  }
  let displayName = user.email;
  let profile = null;
  try{
    var snap = await getDoc(doc(db, 'touristAccounts', user.uid));
    if(snap.exists()){ profile = snap.data(); displayName = profile.displayName; }
  }catch(e){
    console.error('โหลดข้อมูล touristAccounts ไม่สำเร็จ', e);
  }
  currentTourist = profile ? { uid: user.uid, displayName: displayName } : null;
  link.textContent = 'ออกจากระบบ';
  link.href = '#';
  link.onclick = function(e){ e.preventDefault(); signOut(auth).then(function(){ window.location.reload(); }); };
  info.textContent = displayName;
  info.style.display = 'inline-block';
  if(displayedItems.length) renderResults(displayedItems);
});

// รวมเนื้อหาที่เผยแพร่แล้วจากทั้งสอง schema ที่ไม่ตรงกัน (LSHRequests ของนิสิต vs CommunityContent
// ของชุมชน — field ชื่อ/ภาษาคนละชุด ดู CLAUDE.md) มาเป็น array กลางชุดเดียวสำหรับ render/ค้นหา —
// นี่คือการรวมแบบ client-side เท่านั้น ไม่ได้แก้ schema ต้นทางทั้งสองฝั่ง
let allItems = [];
let displayedItems = []; // subset ที่กำลังแสดงอยู่ตอนนี้ (หลังกรองค้นหา) — เก็บ reference เดียวกับ
                          // allItems เสมอ เพื่อให้ cache คำแปล (summaryEn) ไม่หายเมื่อ re-render

async function loadResults(){
  const container = document.getElementById('results');
  try{
    const [studentSnap, communitySnap] = await Promise.all([
      getDocs(query(collection(db, 'LSHRequests'), where('status', '==', 'อนุมัติ'))),
      getDocs(query(collection(db, 'CommunityContent'), where('status', '==', 'เผยแพร่แล้ว'))),
    ]);
    allItems = [];
    studentSnap.forEach(function(d){
      const data = d.data();
      allItems.push({
        id: d.id, type: 'student', title: data.title,
        communityName: data.community || 'ไม่ระบุชุมชน',
        summary: (data.Content || '').slice(0, 80),
        summaryLang: 'th', summaryEn: null, translateState: 'idle', translateError: null,
      });
    });
    communitySnap.forEach(function(d){
      const data = d.data();
      allItems.push({
        id: d.id, type: 'community', title: data.title,
        communityName: data.communityName,
        summary: (data.bodyTh || data.caption || '').slice(0, 80),
        summaryLang: 'th', summaryEn: null, translateState: 'idle', translateError: null,
      });
    });
  }catch(e){
    console.error('โหลดผลลัพธ์ค้นหาไม่สำเร็จ', e);
    container.innerHTML = '<div class="empty-state">โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าใหม่: ' + escapeHtml(e.message) + '</div>';
    return;
  }
  renderResults(allItems);
}

// การ์ดผลลัพธ์แสดงตัวอย่างเนื้อหา (snippet) พร้อมแท็บเลือกภาษา TH/EN เล็กๆ ต่อการ์ด (BL-009) —
// EN เรียก AI แปลแบบ on-demand ผ่าน callAiProxy('translate', ...) ตัวเดียวกับหน้ารายละเอียด
// ไม่ได้แปลทั้งเนื้อหาเต็ม เฉพาะ snippet ที่แสดงในการ์ดเท่านั้น (ตัวเต็มแปลได้ที่หน้ารายละเอียด)
function cardSnippetHtml(it){
  const key = it.type + ':' + it.id;
  const lang = it.summaryLang || 'th';
  const truncated = it.summary.length >= 80 ? '…' : '';
  let bodyHtml;
  if(lang === 'th'){
    bodyHtml = '<p>' + escapeHtml(it.summary) + truncated + '</p>';
  }else if(it.translateState === 'loading'){
    bodyHtml = '<p class="snippet-note">🌐 กำลังแปล...</p>';
  }else if(it.translateState === 'error'){
    bodyHtml = '<p class="snippet-note error">แปลไม่สำเร็จ: ' + escapeHtml(it.translateError || '') + ' (กด EN อีกครั้งเพื่อลองใหม่)</p>';
  }else if(it.translateState === 'done' && it.summaryEn){
    bodyHtml = '<p>' + escapeHtml(it.summaryEn) + truncated + '</p>';
  }else if(!hasAiProxy()){
    bodyHtml = '<p class="snippet-note">AI backend ยังไม่พร้อมใช้งาน</p>';
  }else if(!currentTourist){
    bodyHtml = '<p class="snippet-note">ต้อง<a href="tourist-login.html?redirect=' + encodeURIComponent(selfUrl) + '">เข้าสู่ระบบ</a>ก่อน จึงจะใช้ AI แปลภาษาได้</p>';
  }else{
    bodyHtml = '<p class="snippet-note">🌐 กำลังแปล...</p>'; // กรณี toggleCardSnippetLang เรียก translate ไปแล้วรอ re-render
  }
  return '<span class="snippet-lang-toggle" role="tablist" aria-label="เลือกภาษาตัวอย่างเนื้อหา">' +
      '<button type="button" class="mini-tab' + (lang === 'th' ? ' active' : '') + '" role="tab" aria-selected="' + (lang === 'th') + '" onclick="toggleCardSnippetLang(\'' + key + '\',\'th\')">TH</button>' +
      '<button type="button" class="mini-tab' + (lang === 'en' ? ' active' : '') + '" role="tab" aria-selected="' + (lang === 'en') + '" onclick="toggleCardSnippetLang(\'' + key + '\',\'en\')">EN</button>' +
    '</span>' + bodyHtml;
}

function renderResults(items){
  displayedItems = items;
  const container = document.getElementById('results');
  if(items.length === 0){
    container.innerHTML = '<div class="empty-state">ยังไม่มีเรื่องราวที่เผยแพร่แล้วในระบบตอนนี้</div>';
    return;
  }
  container.innerHTML = items.map(function(it){
    const typeLabel = it.type === 'student' ? 'ผลงานนิสิต' : 'คอนเทนต์ชุมชน';
    const mapsUrl = 'https://www.google.com/maps/search/' + encodeURIComponent(it.communityName);
    return '<div class="card">' +
      '<div class="thumb">ภาพ' + escapeHtml(it.title) + '</div>' +
      '<div class="body">' +
        '<span class="tag">' + typeLabel + '</span>' +
        '<h3>' + escapeHtml(it.title) + '</h3>' +
        '<p>' + escapeHtml(it.communityName) + '</p>' +
        cardSnippetHtml(it) +
        '<div class="card-actions">' +
          '<a class="btn-text" href="tourist-story-detail.html?type=' + it.type + '&id=' + encodeURIComponent(it.id) + '">อ่านเรื่องราว →</a>' +
          '<a class="maps-link" href="' + mapsUrl + '" target="_blank" rel="noopener">🗺️ ดูตำแหน่งบน Google Maps</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function translateSnippet(it){
  it.translateState = 'loading';
  renderResults(displayedItems);
  try{
    const result = await callAiProxy('translate', { text: it.summary });
    it.summaryEn = result;
    it.translateState = 'done';
  }catch(e){
    console.error('AI translate (snippet) failed', e);
    it.translateError = e.message;
    it.translateState = 'error';
  }
  renderResults(displayedItems);
}

window.toggleCardSnippetLang = function(key, lang){
  const it = allItems.find(function(x){ return (x.type + ':' + x.id) === key; });
  if(!it) return;
  it.summaryLang = lang;
  if(lang === 'en' && it.translateState !== 'loading' && it.translateState !== 'done' && hasAiProxy() && currentTourist){
    translateSnippet(it); // จะ re-render ให้เองหลังแปลเสร็จ/พลาด
    return;
  }
  renderResults(displayedItems);
};

window.filterResults = function(){
  var q = document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){ renderResults(allItems); return; }
  var filtered = allItems.filter(function(it){
    return (it.title || '').toLowerCase().indexOf(q) !== -1
        || (it.communityName || '').toLowerCase().indexOf(q) !== -1;
  });
  renderResults(filtered);
};

loadResults();
</script>
<script type="module" src="consent-banner.js"></script>
<script type="module" src="access-log.js"></script>

</body>
</html>
